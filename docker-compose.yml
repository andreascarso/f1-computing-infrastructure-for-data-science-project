services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      # $$ stops compose from substituting; the shell inside the container expands it
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-off job: docker compose run --rm loader
  # The profile keeps it out of `docker compose up`, which would otherwise
  # reload (and so reset) the database every time the stack starts.
  loader:
    profiles: ["load"]
    build: ./loader
    env_file: .env
    environment:
      PGHOST: db            # the db service's name; localhost here would be the loader itself
    volumes:
      - ./data:/data:ro     # read-only: the loader never writes the CSVs
      - ./sql:/sql:ro
    depends_on:
      db:
        condition: service_healthy   # wait for pg_isready, not just for the container to start
    restart: "no"

  # Runs the implementations for bench/benchmark.py, which starts it, runs each
  # repetition with `docker exec` and stops it again. The profile keeps it out
  # of `docker compose up`. The image also holds R and the compiled C and Rust
  # ports (bench/Dockerfile).
  bench:
    profiles: ["bench"]
    build:
      context: .                     # the C and Rust sources are compiled into the image
      dockerfile: bench/Dockerfile   # bench/Dockerfile.dockerignore keeps the context small
    volumes:
      - ./impl:/work/impl:ro
      - ./data:/work/data:ro
      - ./bench:/work/bench   # writable: the check runs write bench/outputs/
    restart: "no"

  # The dashboard: http://localhost:8501. Starts with `docker compose up -d`.
  app:
    build: ./app
    env_file: .env
    environment:
      PGHOST: db            # the db service's name, as for the loader
    ports:
      - "8501:8501"         # laptop:container
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dbdata:
